# Выпуск: при метке версии (например, v2.0.0) собираются подписанный APK, установщик и переносной EXE,
# считаются контрольные суммы SHA-256 и создаётся выпуск на GitHub. Секреты и порядок: docs/release.md.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Метка совпадает с версией в package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Метка $GITHUB_REF_NAME не совпадает с версией в package.json ($want)"
            exit 1
          fi
      - name: В CHANGELOG.md есть раздел этой версии
        run: grep -Fq "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
      - name: Модульные тесты
        run: node --test

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (платформа 36, build-tools)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mgr="$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$mgr" --licenses > /dev/null || true
          "$mgr" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Не задан секрет для $v: без ключа выпуска APK не собирается"; exit 1; fi
          done
          umask 077
          keys="$RUNNER_TEMP/firecalc-keys"
          mkdir -p "$keys"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$keys/firecalc-release.jks"
          {
            echo "storeFile=$keys/firecalc-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$keys/keystore.properties"
          echo "FIRECALC_KEYS_DIR=$keys" >> "$GITHUB_ENV"

      - name: Сборка APK
        run: |
          chmod +x native/android/gradlew
          node tools/native.js android

      - name: Проверка подписи APK
        run: |
          apk="release/Ognetushiteli-${GITHUB_REF_NAME#v}.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"

      - name: Убрать ключ с runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/firecalc-keys"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Сборка установщика и переносного EXE
        run: node tools/native.js windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: '{android,windows}'
          path: dist
          merge-multiple: true

      - name: Контрольные суммы SHA-256
        working-directory: dist
        run: |
          ls -l
          sha256sum Ognetushiteli-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Описание выпуска из CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]:/) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Контрольные суммы SHA-256 в файле SHA256SUMS.txt." >> notes.md

      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Огнетушители ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
